services:
  mysql-db:
    image: mysql:8.0
    container_name: eventops-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: sriram
      MYSQL_DATABASE: eventops
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/setup_database.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psriram"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: eventops-backend
    restart: always
    environment:
      DB_HOST: mysql-db
      DB_PORT: 3306
      DB_NAME: eventops
      DB_USERNAME: root
      DB_PASSWORD: sriram
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      mysql-db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    args:
      VITE_API_URL: http://localhost:8080/api
    container_name: eventops-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
